name: Deploy application

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENCE"
      - "CODEOWNERS"
      - ".gitignore"
      - ".github/workflows/build-pr.yaml"
      - ".github/workflows/codeql-scan.yaml"
      - ".github/workflows/dependabot-automerge.yaml"
      - ".github/workflows/digestabot-automerge.yaml"
      - ".github/workflows/digestabot-update.yaml"
      - ".github/workflows/manual-deploy.yaml"
      - ".github/dependabot.yaml"

  repository_dispatch:
    types: [dependabot-deploy]

env:
  TZ: Europe/Oslo

jobs:
  build-push-image:
    permissions:
      contents: read
      id-token: write
    name: Build application & build/push image
    uses: navikt/mob-gha-workflows/.github/workflows/node-build-push-image.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/node-build-push-image.yaml@v1.1.2
    secrets: inherit

  deploy-dev:
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      deployments: write
    needs: [build-push-image]
    name: Deploy to dev
    uses: navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@9f663f4e1ff4f85a52efa067fbf53c5a6bbaede9 # ratchet:navikt/mob-gha-workflows/.github/workflows/nais-deploy.yaml@v1.1.2
    with:
      cluster: dev-gcp
      resource: .nais/naiserator-dev.yaml
      image: ${{ needs.build-push-image.outputs.image }}

  # deploy-prod:
  #   permissions:
  #     contents: read
  #     id-token: write
  #     pull-requests: write
  #     deployments: write
  #   needs: [ build-push-image , deploy-dev]
